<!DOCTYPE html>

<head>
    <title>&Scy;&Lcy;&Ocy;&Vcy;&Kcy;&Ocy; - a WORDLE clone in Russian</title>

    <link href="./board-style.css" rel="stylesheet">

    <script src="./jquery-3.6.0.min.js"></script>
    <!-- <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> -->

    <script src="./words.js"></script>

    <script>
        /*
         * Global constants and variables
         */
        const
            N_LETTERS = 5,
            N_ATTEMPTS = 6,
            TILE_CLASSES = {
                "-1": "empty",
                "0": "miss",
                "1": "word",
                "2": "position"
            };

        var tableauContents = [[], [], [], [], [], []],
            guessAttempt = 0,
            inputPosition = 0,
            secretLetters = [],
            secretPositions = {},
            guessFlags = new Array(N_LETTERS),
            bestGuessFlags = {};


        /**
         * Processing on-screen keyboard clicks.
         * 
         * @param screenKey{JQuery}
         *  the clicked on-screen key
         */
        function typeLetter(screenKey) {
            if (inputPosition < N_LETTERS) {
                let tableauSquare = $(`#letter${guessAttempt + 1}${inputPosition + 1}`),
                    letter = screenKey.attr("ruLetter");

                tableauSquare.text(letter);
                tableauSquare.attr("key", screenKey.attr("id"));
                tableauContents[guessAttempt].push(letter);
                inputPosition++;
            }

            console.debug(`Clicked ${screenKey.attr("ruLetter")}`);
        }

        /**
         * Erases the last letter of the unchecked guess word.
         */
        function eraseLetter() {
            if (inputPosition > 0) {
                let tableauSquare = $(`#letter${guessAttempt + 1}${inputPosition}`);

                tableauSquare.text("");
                tableauSquare.attr("key", "");
                tableauContents[guessAttempt].pop();
                inputPosition--;
            }
        }

        /**
         * Creates an object mapping each letter of the word
         *  to the list of all of its positions in the word.
         * 
         * @param word{string[]}
         *  an array of letters
         * 
         * @returns {Object<string, number[]>}
         *  an object {"<letter>": <array of the letter's positions>}
         */
        function letterPositions(word) {
            let letters = new Set(word),
                result = {};

            letters.forEach(
                (letter) => result[letter] = word.map(
                    (l, i) => l === letter ? i : -1
                ).filter(
                    (n) => n != -1
                )
            );
            console.debug(`Letter positions in ${word}:`);
            console.debug(result);
            return result;
        }

        /**
         * Sets the list of flags indicating how the letters of the guess word
         *  should be highlighted.
         * 
         * 0 - the letter is missing in the secret word
         *     or the running count of this letter in the guess word
         *     exceeds its total count in the secret word.
         * 
         * 1 - the letter exists in the secret word, but not in this position,
         *     and the running count of this letter in the guess word
         *     doesn't exceed its total count in the secret word.
         * 
         * 2 - the letter is in the same position as in the secret word.
         * 
         * For the running count, the letters in the exact positions are counted first.
         * 
         * @param guessLetters{string[]}
         *  the array of letters of the guess word
         * 
         * @returns {number[]}
         *  array of flags for the letters of the guess word
         */
        function setGuessFlags(guessLetters) {
            let guessPositions = letterPositions(guessLetters);
            guessFlags.fill(0);

            for (const [letter, guessLetterPositions] of Object.entries(guessPositions)) {
                if (letter in secretPositions) {
                    let secretLetterPositions = secretPositions[letter],
                        count = 0;

                    for (const i of guessLetterPositions) {
                        if (secretLetterPositions.includes(i)) {
                            guessFlags[i] = 2;
                            count++;
                        }
                    }
                    for (const i of guessLetterPositions) {
                        if (!secretLetterPositions.includes(i)
                            && count < secretLetterPositions.length) {
                            guessFlags[i] = 1;
                            count++;
                        }
                    }
                }
            }

            console.debug(`Guess flags for ${guessLetters}: ${guessFlags}`);
        }

        /**
         * Updates the best guess flags for the on-screen keys.
         *
         * @param guessLetters{string[]}
         *  an array of single-letter strings
         */
        function updateBestGuessFlags(guessLetters) {
            for (const [i, letter] of guessLetters.entries()) {
                bestGuessFlags[letter] = bestGuessFlags[letter]
                    // If bestKeyFlags[letter] has already been set,
                    // update to the better of old value and flags[i]
                    ? Math.max(bestGuessFlags[letter], guessFlags[i])
                    // Otherwise, set it to flags[i]
                    : guessFlags[i];
            }
        }

        /**
         * Updates the classes of answer tiles and on-screen keys.
         *
         * @param guessLetters{string[]}
         *  an array of single-letter strings
         */
        function updateClasses(guessLetters) {
            for (const [i, letter] of guessLetters.entries()) {
                let tableauSquare = $(`#letter${guessAttempt + 1}${i + 1}`),
                    screenKeyID = tableauSquare.attr("key"),
                    screenKey = $(`#${screenKeyID}`);

                tableauSquare.removeClass(TILE_CLASSES[-1]);
                screenKey.removeClass(function (_, class_name) {
                    // Drop the second class (e.g, "key empty" => "key")
                    return class_name.split(" ")[1];
                });

                tableauSquare.addClass(TILE_CLASSES[guessFlags[i]]);
                screenKey.addClass(TILE_CLASSES[bestGuessFlags[letter]]);
            }
        }

        /**
         * @param element{JQuery}
         *  HTML element to shake
         */
        function shake(element) {
            element.css("position", "relative");
            for (let i = 0; i < 4; i++) {
                element.animate({
                    // 10 for even i, -10 for odd
                    left: 10 * (1 - 2 * (i % 2))
                }, 75);
            }
            element.animate({
                left: 0
            }, 75);
        }

        /**
         * Highlights the playing field squares and on-screen keys
         *  to indicate the guessed letters.
         * 
         * @param guessLetters{string[]}
         */
        function highlight(guessLetters) {
            setGuessFlags(guessLetters);
            updateBestGuessFlags(guessLetters);
            updateClasses(guessLetters);
        }

        /**
         * Validates the guess and provides feedback.
         */
        function checkGuess() {
            if (inputPosition == N_LETTERS && guessAttempt < N_ATTEMPTS) {
                let guessLetters = tableauContents[guessAttempt],
                    guessWord = guessLetters.join("");

                if (validate(guessWord)) {
                    highlight(guessLetters);

                    if (guessWord === secretLetters.join("")) {
                        console.debug("Победа!");
                        // todo: replace with stats screen
                        return;
                    }

                    guessAttempt++;
                    inputPosition = 0;
                }
                else {
                    console.debug(`${guessWord} - некорректное слово!`);
                    let row = $(`#attempt${guessAttempt + 1}`);
                    shake(row);
                }
            }
        }

        /**
         * Checks whether a string is a valid word.
         * 
         * @param word{string}
         *  the string to check
         * 
         * @returns {boolean}
         *  whether the string is a valid word
         */
        function validate(word) {
            return guessWords.includes(word.toLowerCase());
        }

        /**
         * Returns the symbols corresponding to the pressed key.
         * 
         * @param event{JQueryEventObject} keyboard key-down event
         * 
         * @returns {string}
         *  if the pressed key is used in the game, the symbol corresponding to the key
         *  otherwise, an empty string
         */
        function keySymbol(event) {
            console.debug(`Event code "${event.code}"`);

            switch (event.code) {
                case "Enter":
                case "Backspace":
                    return event.code;
                case "Semicolon":
                    return ";";
                case "Quote":
                    return "\\'";
                case "Comma":
                    return ",";
                case "Period":
                    return ".";
                case "BracketLeft":
                    return "[";
                case "BracketRight":
                    return "]";
                default:
                    if (event.code.startsWith("Key")) {
                        return event.code.substr(3, 1);
                    }

                    return "";
            }
        }

        /* Adding keyboard input listening */
        $(document).on("keydown", function (event) {
            let symbol = keySymbol(event);

            if (symbol) {
                console.debug(`Pressed ${symbol}`);
                switch (symbol) {
                    case "Enter":
                        checkGuess(); break;
                    case "Backspace":
                        eraseLetter(); break;
                    default:
                        // Delegating to the on-screen keyboard clicks processing
                        let screenKey = $(`.key > sub:contains('${symbol}')`).parent();
                        screenKey.click();
                }
            }
        });

        /* Main entry point */
        $(document).ready(function () {
            let alphabet = [
                // Cyrillic letters' codes as used in HTML entities, "&<code>cy;"
                "a", "b", "v", "g", "d", "ie", "zh", "z",
                "i", "j", "k", "l", "m", "n", "o", "p",
                "r", "s", "t", "u", "f", "kh", "ts", "ch",
                "sh", "shch", "hard", "y", "soft", "e", "yu", "ya"
            ];

            for (const s of alphabet) {
                // constructing the HTML entity, "&<code>;"
                //  e.g, for the Cyrillic YU, the entity is "$YUcy;"
                let htmlEntity = `&${s.toUpperCase()}cy;`;
                // evaluating the actual text using  
                //  the browser's internal mechanisms
                let text = $("<p></p>").html(htmlEntity).text();

                let screenKey = $(`#${s}`);
                screenKey.attr("ruLetter", text);
                screenKey.on("click", function () {
                    typeLetter(screenKey);
                });
            }

            $("#delete").on("click", eraseLetter);
            $("#check").on("click", checkGuess);

            let secretWord = secretWords[Math.floor(Math.random() * secretWords.length)];

            secretLetters = secretWord.toUpperCase().split("");
            secretPositions = letterPositions(secretLetters);
        });
    </script>
</head>

<body>
