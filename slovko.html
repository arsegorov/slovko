<!DOCTYPE html>

<head>
    <title>&Scy;&Lcy;&Ocy;&Vcy;&Kcy;&Ocy; - a WORDLE clone in Russian</title>

    <link href="./board-style.css" rel="stylesheet">

    <script src="./jquery-3.6.0.min.js"></script>

    <script>
        $(document).on("keydown", function (e) {
            console.debug(`Pressed ${e.code}`);
        });

        $(document).ready(function () {
            let keys = {},
                alphabet = [
                    // Russian as used in HTML's &<code>cy;
                    "a", "b", "v", "g", "d", "ie", "zh", "z",
                    "i", "j", "k", "l", "m", "n", "o", "p",
                    "r", "s", "t", "u", "f", "kh", "ts", "ch",
                    "sh", "shch", "hard", "y", "soft", "e", "yu", "ya"
                ],
                game = $("#game");

            for (i = 0; i < alphabet.length; i++) {
                let key = $("#" + alphabet[i]),
                    newHTML = "&" + alphabet[i].toUpperCase() + "cy;";

                key.on("click", function () {
                    $("#letter11").html(newHTML);
                    console.debug("Clicked " + key.text());
                });
                keys[alphabet[i]] = key;
            }
            $("#delete").on("click", function () {
                $("#letter11").text("")
            })
            $("#check").on("click", function () {
                $("#letter11").text("!")
            })
        });
    </script>
</head>
