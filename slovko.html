<!DOCTYPE html>

<head>
    <title>СЛОВКО - a WORDLE clone in Russian</title>
    <!-- <scirpt src=".jquery-3.6.0.min.js"/> -->
    <script>

    </script>
    <style>
        #game {
            display: grid;
            grid-template-columns: 1fr 460px 1fr;
            grid-template-rows: 150px 550px;
        }
        #title {
            font-family: sans-serif;
            font-size: 100px;
            text-align: center;
            margin: 25px 0px;
            grid-column: 2;
            grid-row: 1;
        }
        #field {
            grid-column: 2;
            grid-row: 2;
            width: 460px;
        }
        .attempt {
            width: 460px;
            height: 80px;
        }
        .letter {
            width: 80px;
            height: 80px;
            font-size: 60px;
            font-family: sans-serif;
            text-align: center;
            color: white;
        }
        .empty {
            background-color: grey;
        }
    </style>
</head>

<body>

        <p id="title">СЛОВКО</p>
